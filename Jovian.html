<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jovian Kurniawan — CV</title>
  <style>
    :root{
      --bg:#0b4f8c;
      --card:#ffffff;
      --muted:#6b7b8c;
      --accent:#0f76c8;
      --glass: rgba(255,255,255,0.08);
      --maxw:900px;
      --radius:14px;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#063a66);color:#0b2b3a;}
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      box-sizing:border-box;
    }
    .card{
      width:100%;
      max-width:var(--maxw);
      background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.96));
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(2,6,23,0.45);
      overflow:hidden;
      display:grid;
      grid-template-columns: 320px 1fr;
    }
    .side{
      background:linear-gradient(180deg,var(--glass), rgba(255,255,255,0.02));
      padding:28px;
      color:#fff;
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:flex-start;
    }
    .avatar{
      width:120px;height:120px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#0f76c8,#2aa0ff);
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:white;
      box-shadow:0 6px 18px rgba(3,10,30,0.4);
    }
    .name{font-size:20px;font-weight:700;color:#fff;margin-top:6px}
    .title{font-size:13px;color:rgba(255,255,255,0.9);margin-top:2px}
    .contact{font-size:13px;color:rgba(255,255,255,0.95);line-height:1.6}
    .skill-list, .lang-list{display:flex;flex-direction:column;gap:8px;width:100%}
    .chip{background:rgba(255,255,255,0.08);padding:8px 10px;border-radius:8px;font-size:13px;color:#eaf6ff}
    hr.sep{border:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);width:100%}
    .main{padding:28px 32px;color:#072033}
    .section{margin-bottom:18px}
    .section h3{margin:0 0 8px 0;font-size:16px;color:var(--accent)}
    .about{font-size:14px;color:var(--muted);line-height:1.6}
    .edu-item, .job-item, .ach-item{background:rgba(11,75,140,0.03);padding:12px;border-radius:10px;margin-bottom:10px}
    .meta{font-size:13px;color:var(--muted)}
    .degree{font-weight:600;color:#072033}
    .skills-inline{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .skill-pill{background:#e8f4ff;color:#063a66;padding:6px 10px;border-radius:999px;font-size:13px}
    .footer-note{font-size:12px;color:var(--muted);margin-top:12px}
    .controls{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
    .controls button{background:#0f76c8;color:white;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    .editing{outline:2px dashed rgba(15,118,200,0.25);padding:2px;border-radius:6px}

      .side{flex-direction:row;gap:12px;align-items:center;padding
